# Root logger option
log4j.rootLogger=INFO, stdout

log4j.logger.rx=INFO, stdout_rx
log4j.additivity.rx=false
log4j.logger.tx=INFO, stdout_tx
log4j.additivity.tx=false
log4j.logger.state=ERROR, stdout_state
log4j.additivity.state=false

# Direct log messages to stdout
log4j.appender.stdout=org.apache.log4j.ConsoleAppender
log4j.appender.stdout.Target=System.out
log4j.appender.stdout.layout=org.apache.log4j.PatternLayout
log4j.appender.stdout.layout.ConversionPattern=%d{yyyy-MM-dd HH:mm:ss} %-5p %m [%c{1}:%L][%tid]%n

log4j.appender.stdout_rx=org.apache.log4j.ConsoleAppender
log4j.appender.stdout_rx.Target=System.out
log4j.appender.stdout_rx.layout=org.apache.log4j.PatternLayout
log4j.appender.stdout_rx.layout.ConversionPattern=%d{yyyy-MM-dd HH:mm:ss} %-5p <<< %m [%c{1}:%L][%tid]%n

log4j.appender.stdout_tx=org.apache.log4j.ConsoleAppender
log4j.appender.stdout_tx.Target=System.out
log4j.appender.stdout_tx.layout=org.apache.log4j.PatternLayout
log4j.appender.stdout_tx.layout.ConversionPattern=%d{yyyy-MM-dd HH:mm:ss} %-5p >>> %m [%c{1}:%L][%tid]%n

log4j.appender.stdout_state=org.apache.log4j.ConsoleAppender
log4j.appender.stdout_state.Target=System.out
log4j.appender.stdout_state.layout=org.apache.log4j.PatternLayout
log4j.appender.stdout_state.layout.ConversionPattern=%d{yyyy-MM-dd HH:mm:ss} %-5p %m [%c{1}:%L][%tid]%n
