# Acquisition_Idle_Duration represents the time that shall be used to radiate the idle sequence pattern after carrier only to enable the receiving transceiver to achieve symbol synchronization and decoder lock.
acquisition_idle_duration=1
# value loaded into the CARRIER_LOSS_TIMER based upon the conditions defined in 5.2.1.3
carrier_loss_timer_duration=3
# time that shall be used to radiate an unmodulated carrier at the beginning of a transmission
carrier_only_duration=1
# time period during which the Comm_Change activity shall be repeated until the expected Comm_Change_Response is detected
comm_change_lifetime=3
# provided to the local vehicle controller by the caller and/or responder upon success or failure of the Comm_Change activity
comm_change_notification=
# used by the responder to acknowledge that the persistent activity has been accepted.
comm_change_response=
# time that the caller shall wait for the Comm_Change_Response to the Comm_Change directive
# should be more than (tail_idle_duration + carrier_only_duration)
comm_change_waiting_period=3
# time period during which the persistent activity shall be repeated until the expected Hail_Response is detected. Implementation: number of attemps. 
hail_lifetime=3
# provided to the local vehicle controller by the caller and/or responder upon success or failure of the persistent activity
hail_notification=
# used by the responder to acknowledge that the persistent activity has been accepted
# Implementation: 0 - TransferFrame is expected, 1 - SymbolInLock is enough
hail_response=0
# time that the initiating transceiver (caller) waits for a response to the Hail
hail_wait_duration=3
hailing_channel=
# data rate assigned during the Hail activity
hailing_data_rate=
# symbol rate assigned during the Hail activity
hailing_symbol_rate=
# A frequency (e.g., 100 Hz) that is used for interval timing.
interval_clock=1000
# Used to establish the step size in fractions of a dB reporting the instantaneous link SNR by the radio
link_snr_step=
# Used to set the value of the local receiverâ€™s PCID
local_pcid=
# value of the spacecraft ID for this local spacecraft.
local_spacecraft_id=
# Defines the maximum number of times the transceiver is allowed to cycle through S50->S56->S58->S62->E50->S51->S52->S50 before E83 is triggered forcing the transceiver into S80 (reconnect).
maximum_failed_token_passes=3
# What frame version to use for P-frames: 3 (Proximity-1) or 4 (USLP)
frame_version=3
# maximum size Transfer Frame transferred between nodes. Link efficiency at various data rates may require varying frame lengths.
maximum_frame_length=2043
# Maximum size of a packet in octets.  Used in the segmentation process. 
maximum_packet_size=
# maximum amount of time the initiating transceiver stays in persistence until either (1) it receives an acknowledgement from the remote transceiver that the Comm_Change was acted upon, or (2) the wait timer times out.
persistence_wait_time=1
# maximum transmission time between successive PLCWs
plcw_repeat_interval=5
# maximum time that the half-duplex receiver is anticipating that the sending side shall be transmitting
receive_duration=2
# Used in full- and half-duplex data services. The caller drops the carrier for this defined amount of time. Used to force the responder to lose carrier lock and therefore transition to State S2: Waiting for Hail.
drop_carrier_duration=
# Used to identify the powered receiver used by the remote transceiver.
remote_pcid=
# Used to address one or several remote spacecraft, as opposed to the local spacecraft. 
remote_spacecraft_id=
# If Resync_Local equals false, it is the responsibility of the local controller to decide how synchronization will be re-established.  Otherwise, if true, the Sender Nodeâ€™s FOP-P forces synchronization by requesting a SET V(R) persistent activity. 
resync_local=true
# Used in the FOP-P Set V(R) persistent activity. 
resync_lifetime=3
# Used in the FOP-P Set V(R) persistent activity
resync_notification=
# Used in the FOP-P Set V(R) persistent activity.
resync_response=
# Used in the FOP-P Set V(R) persistent activity.
resync_waiting_period=1
# maximum time that the half-duplex transmitter shall transmit data before it relinquishes the token
send_duration=2
# 0 €™= Source SCID; 1 = Destination SCID.
source_destination_id=0
# a countdown timer that contains the time a sender shall wait to receive a valid PLCW from a receiver before taking action to synchronize with the receiver
synch_timeout=1
# time that shall be used to radiate the idle sequence pattern at the end of a transmission to enable the receiving transceiver to process the last transmitted frame
tail_idle_duration=1
# used to determine whether the SCID field in received frames whose Source-or-Destination IDs are set to source is to be validated
test_source=true
# Sets the maximum size of the transmission window for the COP-P. 
transmission_window=10
