# The presence or absence of the optional Transfer Frame Insert Zone shall be established by management. Define number of bytes. If 0, then not used
aos.insertZoneLength=0
# The presence or absence of the optional Frame Header Error Control shall be established by management.
aos.frameHeaderErrorControl=false
# Type of data units transffered inside frame. 1 - M_PDU, 2 - B_PDU, 3 - VCA_SDU
aos.dataUnitType=1
# The presence or absence of the optional OPERATIONAL CONTROL FIELD
aos.ocf=false
# Presence of Frame Error Control 
aos.frameErrorControl=false

# Length of Insert Zone. 
framev4.insertZoneLength=0
# Presence of Frame Error Control 
framev4.frameErrorControl=false
# Type of frame: false - means variable length and defined by the "Frame Length" within the header, true - fixed length and controlled by maximum_frame_length
framev4.fixedLength=false

# U-frame version to use: 2 (AOS), 3 (Proximity-1) or 4 (USLP)
u_frame_version=3

# spdu version to use: 1 (Proximity-1), 2 (First Generation Lunar Use) or 3 (Second Generation Lunar Use)
spdu_version=1

# wait for graceful shutdown
shutdown_duration=10

# This property is mentioned in the spec, but not defined in the mib
reconnect_wait_duration=2